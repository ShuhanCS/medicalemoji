    <path d="M 4 -2 C 9 3 12 9 14 16" fill="none" stroke="#5E1D26" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M 4 -2 C 9 3 12 9 14 16" fill="none" stroke="url(#vessel)" stroke-width="3.3" stroke-linecap="round"/>
