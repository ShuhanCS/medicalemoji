<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <title>Kidney emoji color reference artwork</title>
  <desc>Original textless single-kidney paradigm with a hilum, vessel, and ureter.</desc>
  <rect width="72" height="72" fill="#ffffff"/>
  <defs><radialGradient id="kidney-body" cx="34%" cy="30%" r="82%">
      <stop offset="0" stop-color="#D96D68"/>
