<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg, #3452ff 0%, #7b2ff7 55%, #ff1053 100%);
    color: #fff; overflow: hidden; }
  .wrap { padding: 52px 60px; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kicker { font-size: 19px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; opacity: .92; }
  h1 { font-size: 60px; font-weight: 800; line-height: 1.04; margin-top: 14px; letter-spacing: -1px; max-width: 820px; }
  .badge { text-align: center; background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.55); border-radius: 16px; padding: 12px 20px; flex-shrink: 0; }
  .badge .b1 { font-size: 12px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; opacity: .9; }
  .badge .b2 { font-size: 36px; font-weight: 800; line-height: 1; margin-top: 3px; }
  .badge .b3 { font-size: 11px; margin-top: 5px; opacity: .9; }
  .panel { margin-top: auto; background: #fff; border-radius: 20px; padding: 22px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .panel img { width: 86px; height: 86px; object-fit: contain; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .foot .l { font-size: 23px; font-weight: 500; opacity: .95; }
  .foot .url { font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker">ACEP Letter of Support</div>
      <h1>Medical emoji: a universal language for health</h1>
    </div>
    <div class="badge">
      <div class="b1">Letter of Support</div>
      <div class="b2">ACEP</div>
      <div class="b3">American College of<br/>Emergency Physicians</div>
    </div>
  </div>
  <div class="panel">
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/5-liver.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/kidneysnew2.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/3-stomach.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/1-intestines.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/14-white-blood-cell-1.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/13-ecg-1.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/4-bottom_spine.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/8-blood-bagcolor.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/7-pill-pack.png"/>
    <img src="file:///C:/Users/Shuha/projects/medicalemoji/public/images/emoji/11-scales.png"/>
  </div>
  <div class="foot">
    <div class="l">Ten clinical concepts now in development for Unicode</div>
    <div class="url">medicalemoji.org</div>
  </div>
</div>
</body>
</html>
