
<svg xmlns='http://www.w3.org/2000/svg' width='576' height='576'
     viewBox='0 0 72 72'>
  <defs>
    <radialGradient id='body' cx='0.34' cy='0.32' r='0.85'>
      <stop offset='0'    stop-color='#d2685f'/>
      <stop offset='0.45' stop-color='#a83a31'/>
      <stop offset='0.82' stop-color='#82231d'/>
      <stop offset='1'    stop-color='#6b1a15'/>
    </radialGradient>
    <radialGradient id='gloss' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#ffffff' stop-opacity='0.7'/>
      <stop offset='1' stop-color='#ffffff' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='artery' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#e0584c'/>
      <stop offset='1' stop-color='#b22c24'/>
    </linearGradient>
    <linearGradient id='ureter' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#f4ead0'/>
      <stop offset='1' stop-color='#d3b87e'/>
    </linearGradient>
    <radialGradient id='hilum' cx='0.4' cy='0.4' r='0.7'>
      <stop offset='0' stop-color='#9c3a36'/>
      <stop offset='1' stop-color='#6e1f1b'/>
    </radialGradient>
    <filter id='inner' x='-30%' y='-30%' width='160%' height='160%'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='2.4' result='blur'/>
      <feComposite operator='out' in='SourceGraphic' in2='blur' result='inv'/>
      <feFlood flood-color='#4a1009' flood-opacity='0.85'/>
      <feComposite operator='in' in2='inv' result='sh'/>
      <feComposite operator='over' in='sh' in2='SourceGraphic'/>
    </filter>
    <filter id='soft' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='1.6'/>
    </filter>
    <filter id='drop' x='-40%' y='-40%' width='180%' height='180%'>
      <feDropShadow dx='0' dy='1.2' stdDeviation='1.1'
        flood-color='#3a0d08' flood-opacity='0.35'/>
    </filter>
  </defs>

  <g transform='translate(33 37) scale(1.22) rotate(-12)' filter='url(#drop)'>
    <path d='M 2 -23 C 13 -23 17 -11 12 -1 C 12 4 12 7 11 11 C 13 17 10 24 1 25 C -12 27 -23 19 -26 7 C -29 -1 -27 -10 -23 -16 C -18 -23 -8 -24 2 -23 Z' fill='url(#body)' stroke='#591611' stroke-width='2.0'
          stroke-linejoin='round' filter='url(#inner)'/>
    <path d='M 2 -23 C 13 -23 17 -11 12 -1 C 12 4 12 7 11 11 C 13 17 10 24 1 25 C -12 27 -23 19 -26 7 C -29 -1 -27 -10 -23 -16 C -18 -23 -8 -24 2 -23 Z' fill='none' stroke='#591611' stroke-width='2.0'
          stroke-linejoin='round'/>
    <!-- one chunky ureter nub low on the medial side (plumbing cue) -->
    <path d='M 9 9 C 12 13 13 16 15 21' fill='none' stroke='#a98a4f'
          stroke-width='5.6' stroke-linecap='round'/>
    <path d='M 9 9 C 12 13 13 16 15 21' fill='none' stroke='url(#ureter)'
          stroke-width='3.8' stroke-linecap='round'/>
    <!-- tiny red node at the nub base, low (does not notch the top) -->
    <ellipse cx='9' cy='7' rx='2.6' ry='2.8' fill='url(#hilum)'
             stroke='#591611' stroke-width='1.5'/>
    <!-- specular highlight -->
    <ellipse cx='-12' cy='-9' rx='8' ry='5'
             transform='rotate(-28 -12 -9)' fill='url(#gloss)' filter='url(#soft)'/>
  </g>
</svg>
