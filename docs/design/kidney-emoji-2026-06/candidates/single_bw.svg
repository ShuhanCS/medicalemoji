<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 72 72'>
  <defs>
    <linearGradient id='kid' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#c75b54'/>
      <stop offset='0.55' stop-color='#a23730'/>
      <stop offset='1' stop-color='#7d251f'/>
    </linearGradient>
    <radialGradient id='gloss' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#ffffff' stop-opacity='0.55'/>
      <stop offset='1' stop-color='#ffffff' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='ureter' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#f2e6c4'/>
      <stop offset='1' stop-color='#d8bf86'/>
    </linearGradient>
  </defs>

  <g transform='translate(34 37) scale(1.18 1.18) rotate(-12)'>
    <!-- renal artery stub: fat rounded tube from hilum -->
    <path d='M -1 -1 C 7 -4 14 -6 20 -9' fill='none' stroke='#1a1a1a'
          stroke-width='3.8644067796610173' stroke-linecap='round'/>
    <path d='M -1 -1 C 7 -4 14 -6 20 -9' fill='none' stroke='#ffffff'
          stroke-width='2.264406779661017' stroke-linecap='round'/>
    <!-- ureter stub: tan tube curving down from hilum (kept fat for 18px) -->
    <path d='M -1 3 C 5 10 11 17 17 26' fill='none' stroke='#1a1a1a'
          stroke-width='4.464406779661017' stroke-linecap='round'/>
    <path d='M -1 3 C 5 10 11 17 17 26' fill='none' stroke='#d9d9d9'
          stroke-width='3.064406779661017' stroke-linecap='round'/>
    <!-- kidney body -->
    <path d='M 2 -25 C 9 -23 11 -14 7 -6 C 5 -3 -1 -3 -1 0 C -1 3 5 3 7 9 C 10 17 9 23 2 25 C -10 27 -22 19 -25 7 C -27 1 -27 -7 -24 -13 C -20 -21 -8 -26 2 -25 Z' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.0338983050847457'
          stroke-linejoin='round'/>
    
  </g>
</svg>